image:
  repository: 683210040028.dkr.ecr.eu-central-1.amazonaws.com/terraform-demo-ecr
  tag: django-app-1
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

ingress:
  enabled: false

postgres:
  # Set to true only for local/dev when no external RDS is available.
  # In production the app connects to the AWS RDS instance (see rdsSecretName below).
  enabled: false
  image: postgres:16
  serviceName: db

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

# Non-sensitive configuration — rendered as a ConfigMap.
config:
  POSTGRES_PORT: 5432
  POSTGRES_HOST: ""        # overridden at runtime by the Secret referenced in rdsSecretName
  POSTGRES_USER: django_user
  POSTGRES_DB: django_db

# Sensitive configuration — rendered as a Kubernetes Secret (only when rdsSecretName is empty).
# In production these values come from the Terraform-managed Secret (see rdsSecretName).
secrets:
  POSTGRES_PASSWORD: "pass9764gd"

# Name of the Terraform-managed Kubernetes Secret that contains the real RDS credentials
# (POSTGRES_HOST and POSTGRES_PASSWORD).  When set, the chart-managed Secret is NOT created
# and the deployment loads credentials directly from this pre-existing Secret.
rdsSecretName: "django-app-rds"
